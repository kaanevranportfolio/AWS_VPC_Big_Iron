- name: Validate Nginx Configuration
  command: nginx -t
  register: nginx_test
  ignore_errors: yes

- name: Fail if Nginx Configuration is Invalid
  fail:
    msg: "Nginx configuration is invalid: {{ nginx_test.stderr }}"
  when: nginx_test.rc != 0

- name: Reload Nginx Service
  service:
    name: nginx
    state: reloaded
  when: nginx_test.rc == 0